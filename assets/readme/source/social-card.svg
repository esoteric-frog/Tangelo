<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Tangelo</title>
<desc id="desc">Tangelo, a Mac menu-bar file converter with a wheel of format slices.</desc>
<rect id="bg" width="1280" height="640" rx="0" fill="#FFF6EC"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="88" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="3" fill="#F26A21">MAC MENU-BAR FILE CONVERTER</text>
<text x="82" y="370" font-size="136" font-weight="800" letter-spacing="-4" fill="#2B1A12">Tangelo</text>
<text x="88" y="440" font-size="38" font-weight="600" fill="#2B1A12">Drag. Hold <tspan fill="#F26A21">⌃</tspan>. Drop on a slice.</text>
</g>
<g transform="translate(930 320) scale(1.25) translate(-930 -320)">
