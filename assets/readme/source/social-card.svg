<text x="1041.3" y="292.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="1">PNG</text>
<text x="998.8" y="423.3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="2">AVIF</text>
