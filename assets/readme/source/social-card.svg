<path d="M775.0 350.9 A158.0 158.0 0 0 1 822.8 203.9 L879.0 281.3 A64.0 64.0 0 0 0 866.0 321.3 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="28" stroke-linejoin="round"/>
