<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Tangelo: drag a file, hold Control, drop it on a slice</title>
<desc id="desc">A glass wheel of format slices (JPG, PNG, AVIF, WebP, TIFF) opens at the pointer while a photo.heic file is dragged; the WebP slice is lit orange.</desc>
<rect id="bg" width="1200" height="420" rx="28" fill="#FFF6EC"/>
<g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#F26A21">MAC MENU-BAR FILE CONVERTER</text>
<text x="60" y="190" font-size="104" font-weight="800" letter-spacing="-3" fill="#2B1A12">Tangelo</text>
<text x="64" y="248" font-size="32" font-weight="600" fill="#2B1A12">Drag a file. Hold <tspan fill="#F26A21">⌃</tspan>.</text>
<text x="64" y="290" font-size="32" font-weight="600" fill="#2B1A12">Drop it on a slice.</text>
<text x="64" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#9A7B63">photo.heic  →  photo.webp, right next to it</text>
</g>
<g id="wheel">
<circle cx="900" cy="214" r="182" fill="#F26A21" opacity="0.08"/>
<path d="M822.7 76.2 A158.0 158.0 0 0 1 977.3 76.2 L921.0 153.6 A64.0 64.0 0 0 0 879.0 153.6 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="28" stroke-linejoin="round"/>
<path d="M1007.2 97.9 A158.0 158.0 0 0 1 1055.0 244.9 L964.0 215.3 A64.0 64.0 0 0 0 951.0 175.3 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="28" stroke-linejoin="round"/>
<path d="M1043.5 280.1 A158.0 158.0 0 0 1 918.5 370.9 L918.5 275.3 A64.0 64.0 0 0 0 952.6 250.5 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="28" stroke-linejoin="round"/>
<path d="M881.5 370.9 A158.0 158.0 0 0 1 756.5 280.1 L847.4 250.5 A64.0 64.0 0 0 0 881.5 275.3 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="28" stroke-linejoin="round"/>
<path d="M745.0 244.9 A158.0 158.0 0 0 1 792.8 97.9 L849.0 175.3 A64.0 64.0 0 0 0 836.0 215.3 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="28" stroke-linejoin="round"/>
<text x="900.0" y="105.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="0">JPG</text>
<text x="1011.3" y="186.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="1">PNG</text>
<text x="968.8" y="317.3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="2">AVIF</text>
<text x="831.2" y="317.3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="3">WebP</text>
<text x="788.7" y="186.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B1A12" data-slice="4">TIFF</text>
<text x="900" y="221" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#9A7B63">Convert</text>
</g>
<g id="hot"><path d="M881.5 370.9 A158.0 158.0 0 0 1 756.5 280.1 L847.4 250.5 A64.0 64.0 0 0 0 881.5 275.3 Z" fill="#F26A21" stroke="#F26A21" stroke-width="28" stroke-linejoin="round"/></g>
<g id="hot-label"><text x="831.2" y="317.3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">WebP</text></g>
<g id="hot-center"><circle cx="900" cy="214" r="48" fill="#FFF6EC"/><text x="900" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#F26A21">WebP</text></g>
<g id="drag">
<g id="drag-file" transform="translate(652.174474961239 265.432838938936)">
<path d="M0 0 H44 L62 18 V78 H0 Z" fill="#FFFFFF" stroke="#E7CDB5" stroke-width="2" stroke-linejoin="round"/>
<path d="M44 0 V18 H62" fill="none" stroke="#E7CDB5" stroke-width="2" stroke-linejoin="round"/>
<rect x="-8" y="44" width="56" height="22" rx="6" fill="#8E8E93"/>
<text x="20" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">HEIC</text>
</g>
<g transform="translate(764.174474961239 309.432838938936)"><path d="M0 0 L0 30 L8 23 L14 36 L20 33 L14 21 L25 21 Z" fill="#2B1A12" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/></g>
</g>
</svg>
